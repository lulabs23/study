name: EDT Unicaen

on:
  schedule:
    - cron: '17 4-19/3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edt-unicaen
  cancel-in-progress: true

jobs:
  edt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/edt-unicaen.mjs
        env:
          UNICAEN_USER: ${{ secrets.UNICAEN_USER }}
          UNICAEN_PASSWORD: ${{ secrets.UNICAEN_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
