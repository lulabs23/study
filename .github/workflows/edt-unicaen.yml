name: EDT Unicaen

# Récupère l'emploi du temps et les derniers mails Unicaen et les écrit dans le Gist de l'application.
# Envoie aussi les réponses rédigées dans l'application, marque comme lus les mails ouverts
# et génère les QCM demandés depuis une fiche (Gemini : secret GEMINI_API_KEY, clé gratuite de Google AI Studio).
# Secrets requis (Settings → Secrets and variables → Actions) :
#   UNICAEN_USER, UNICAEN_PASSWORD, GIST_TOKEN — et GIST_ID (facultatif)
# Lancé toutes les 30 minutes par cron-job.org (workflow_dispatch) ; le cron ci-dessous sert de secours.

on:
  schedule:
    - cron: '17,47 5-21 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Une exécution à la fois, sans interrompre celle en cours (une réponse ne doit pas partir deux fois)
concurrency:
  group: edt-unicaen
  cancel-in-progress: false

jobs:
  edt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer l'emploi du temps et les mails
        run: node scripts/edt-unicaen.mjs
        env:
          UNICAEN_USER: ${{ secrets.UNICAEN_USER }}
          UNICAEN_PASSWORD: ${{ secrets.UNICAEN_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          MAILS: ${{ vars.MAILS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
